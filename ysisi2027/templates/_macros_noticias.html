{% macro icono_noticia(tipo) %}
{% if tipo == "calendario" %}
<svg viewBox="0 0 100 100" class="icono-noticia" xmlns="http://www.w3.org/2000/svg">
    <rect x="15" y="20" width="70" height="65" rx="6" fill="#123c22" stroke="#22c55e" stroke-width="3"/>
    <rect x="15" y="20" width="70" height="18" rx="6" fill="#22c55e"/>
    <rect x="28" y="10" width="6" height="16" rx="3" fill="#22c55e"/>
    <rect x="66" y="10" width="6" height="16" rx="3" fill="#22c55e"/>
    {% for fila in range(3) %}{% for col in range(4) %}
    <rect x="{{ 24 + col*15 }}" y="{{ 48 + fila*13 }}" width="9" height="9" rx="2" fill="#1f3327"/>
    {% endfor %}{% endfor %}
    <rect x="54" y="61" width="9" height="9" rx="2" fill="#22c55e"/>
</svg>
{% elif tipo == "jersey" %}
<svg viewBox="0 0 100 100" class="icono-noticia" xmlns="http://www.w3.org/2000/svg">
    <path d="M30 15 L10 28 L18 45 L30 38 L30 88 L70 88 L70 38 L82 45 L90 28 L70 15 L60 24 L40 24 Z"
          fill="#22c55e" stroke="#123c22" stroke-width="2"/>
    <text x="50" y="65" text-anchor="middle" font-size="26" font-weight="700" fill="#0b1512">10</text>
</svg>
{% elif tipo == "gol" %}
<svg viewBox="0 0 100 100" class="icono-noticia" xmlns="http://www.w3.org/2000/svg">
    <rect x="10" y="30" width="80" height="55" fill="none" stroke="#22c55e" stroke-width="3"/>
    {% for i in range(5) %}<line x1="{{ 10 + i*20 }}" y1="30" x2="{{ 10 + i*20 }}" y2="85" stroke="#22c55e" stroke-width="1" opacity="0.5"/>{% endfor %}
    {% for i in range(4) %}<line x1="10" y1="{{ 30 + i*14 }}" x2="90" y2="{{ 30 + i*14 }}" stroke="#22c55e" stroke-width="1" opacity="0.5"/>{% endfor %}
    <circle cx="35" cy="60" r="12" fill="#ffffff"/>
    <path d="M35 50 L40 55 L38 62 L32 62 L30 55 Z" fill="#123c22"/>
</svg>
{% elif tipo == "entrevista" %}
<svg viewBox="0 0 100 100" class="icono-noticia" xmlns="http://www.w3.org/2000/svg">
    <rect x="42" y="15" width="16" height="35" rx="8" fill="#22c55e"/>
    <path d="M30 45 Q30 65 50 65 Q70 65 70 45" fill="none" stroke="#22c55e" stroke-width="4"/>
    <line x1="50" y1="65" x2="50" y2="80" stroke="#22c55e" stroke-width="4"/>
    <line x1="35" y1="80" x2="65" y2="80" stroke="#22c55e" stroke-width="4"/>
</svg>
{% elif tipo == "lesion" %}
<svg viewBox="0 0 100 100" class="icono-noticia" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="38" fill="none" stroke="#ef4444" stroke-width="3"/>
    <rect x="42" y="25" width="16" height="50" rx="4" fill="#ef4444"/>
    <rect x="25" y="42" width="50" height="16" rx="4" fill="#ef4444"/>
</svg>
{% elif tipo == "plantilla" %}
<svg viewBox="0 0 100 100" class="icono-noticia" xmlns="http://www.w3.org/2000/svg">
    {% for cx in [30, 50, 70] %}
    <circle cx="{{ cx }}" cy="35" r="11" fill="#22c55e"/>
    <path d="M{{ cx-16 }} 75 Q{{ cx-16 }} 52 {{ cx }} 52 Q{{ cx+16 }} 52 {{ cx+16 }} 75 Z" fill="#22c55e"/>
    {% endfor %}
</svg>
{% elif tipo == "estrella" %}
<svg viewBox="0 0 100 100" class="icono-noticia" xmlns="http://www.w3.org/2000/svg">
    <polygon points="50,10 61,38 91,38 67,56 76,85 50,68 24,85 33,56 9,38 39,38"
             fill="#facc15" stroke="#123c22" stroke-width="2"/>
</svg>
{% else %}
<svg viewBox="0 0 100 100" class="icono-noticia" xmlns="http://www.w3.org/2000/svg">
    <circle cx="50" cy="50" r="38" fill="none" stroke="#22c55e" stroke-width="3"/>
    <ellipse cx="50" cy="50" rx="38" ry="16" fill="none" stroke="#22c55e" stroke-width="2"/>
    <line x1="12" y1="50" x2="88" y2="50" stroke="#22c55e" stroke-width="2"/>
    <line x1="50" y1="12" x2="50" y2="88" stroke="#22c55e" stroke-width="2"/>
</svg>
{% endif %}
{% endmacro %}
